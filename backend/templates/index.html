{% load vite_assets %}
<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MyHomeBro - Secure Escrow Payments</title>
    <meta name="theme-color" content="#07182f" />
    <meta name="application-name" content="MyHomeBro" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- ✅ In production, WhiteNoise serves these at /static/... -->
    <link rel="icon" type="image/png" href="/static/favicon-192x192.png" />
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png" sizes="180x180" />
    <link rel="mask-icon" href="/static/masked-icon.svg" color="#1E3A8A" />

    <!-- CSP: keep same-origin assets & API calls; fonts allowed -->
    <meta name="csp-nonce" content="{{ csp_nonce }}" />
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' https://js.stripe.com https://connect-js.stripe.com https://maps.googleapis.com https://maps.gstatic.com;
      style-src 'self' 'nonce-{{ csp_nonce }}' https://fonts.googleapis.com;
      style-src-elem 'self' 'nonce-{{ csp_nonce }}' https://fonts.googleapis.com;
      style-src-attr 'unsafe-inline';
      font-src 'self' https://fonts.gstatic.com data:;
      img-src 'self' data: https://*.stripe.com https://maps.googleapis.com https://maps.gstatic.com;
      connect-src 'self' ws: wss: https://api.stripe.com https://maps.googleapis.com https://maps.gstatic.com https://places.googleapis.com;
      frame-src 'self' blob: https://connect-js.stripe.com https://js.stripe.com https://hooks.stripe.com;
      child-src 'self' blob:;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
      worker-src 'self';
      manifest-src 'self';
    " />
    {% if google_maps_api_key %}
    <meta name="mhb-google-maps-api-key" content="{{ google_maps_api_key }}">
    {% endif %}
    <script type="module" crossorigin src="{% vite_entry_js %}"></script>
    {% vite_entry_css as vite_css_href %}
    {% if vite_css_href %}
    <link rel="stylesheet" crossorigin href="{{ vite_css_href }}">
    {% endif %}
  </head>
  <body>
    <div id="root" aria-live="polite"></div>
    <!-- Legacy template kept in sync via Vite manifest resolution. -->
  </body>
</html>

{% load vite_assets %}
<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ seo_title }}</title>
    <meta name="description" content="{{ seo_description }}" />
    <meta name="robots" content="{{ seo_robots }}" />
    <link rel="canonical" href="{{ seo_canonical_url }}" />
    <meta property="og:site_name" content="MyHomeBro" />
    <meta property="og:title" content="{{ seo_title }}" />
    <meta property="og:description" content="{{ seo_social_description }}" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{ seo_canonical_url }}" />
    <meta property="og:image" content="{{ seo_social_image }}" />
    <meta property="og:image:alt" content="MyHomeBro" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{ seo_title }}" />
    <meta name="twitter:description" content="{{ seo_social_description }}" />
    <meta name="twitter:image" content="{{ seo_social_image }}" />
    {% if search_verification %}<meta name="google-site-verification" content="{{ search_verification }}" />{% endif %}
    <meta name="theme-color" content="#07182f" />
    <meta name="application-name" content="MyHomeBro" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- ✅ In production, WhiteNoise serves these at /static/... -->
    <link rel="icon" type="image/png" href="/static/favicon-192x192.png" />
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png" sizes="180x180" />
    <link rel="mask-icon" href="/static/masked-icon.svg" color="#1E3A8A" />

    <!-- CSP: WebKit requires inline-style compatibility for runtime-generated
         component styles. Script execution remains restricted separately. -->
    <meta name="csp-nonce" content="{{ csp_nonce }}" />
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' https://js.stripe.com https://connect-js.stripe.com https://maps.googleapis.com https://maps.gstatic.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com;
      style-src-attr 'unsafe-inline';
      font-src 'self' https://fonts.gstatic.com data:;
      img-src 'self' data: https://*.stripe.com https://maps.googleapis.com https://maps.gstatic.com;
      connect-src 'self' ws: wss: https://api.stripe.com https://maps.googleapis.com https://maps.gstatic.com https://places.googleapis.com;
      frame-src 'self' blob: https://connect-js.stripe.com https://js.stripe.com https://hooks.stripe.com;
      child-src 'self' blob:;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
      worker-src 'self';
      manifest-src 'self';
    " />
    {% if google_maps_api_key %}
    <meta name="mhb-google-maps-api-key" content="{{ google_maps_api_key }}">
    {% endif %}
    <!-- react-hot-toast/goober reuses this nonce-authorized sheet instead of
         creating an untrusted inline style element at runtime. -->
    <style id="_goober" nonce="{{ csp_nonce }}"> </style>
    {% if seo_indexable and seo_canonical_url == "https://www.myhomebro.com/" %}
    <script type="application/ld+json" nonce="{{ csp_nonce }}">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://www.myhomebro.com/#organization","name":"MyHomeBro","url":"https://www.myhomebro.com/","logo":"https://www.myhomebro.com/static/myhomebro_logo.png","description":"Plan DIY projects, connect with contractors, manage agreements, track milestones, make project payments, and keep your home improvements organized with MyHomeBro."},{"@type":"WebSite","@id":"https://www.myhomebro.com/#website","url":"https://www.myhomebro.com/","name":"MyHomeBro","publisher":{"@id":"https://www.myhomebro.com/#organization"}}]}</script>
    {% endif %}
    <script type="module" crossorigin src="{% vite_entry_js %}"></script>
    {% vite_entry_css as vite_css_href %}
    {% if vite_css_href %}
    <link rel="stylesheet" crossorigin href="{{ vite_css_href }}">
    {% endif %}
  </head>
  <body>
    <div id="root" aria-live="polite"></div>
    <!-- Legacy template kept in sync via Vite manifest resolution. -->
  </body>
</html>
